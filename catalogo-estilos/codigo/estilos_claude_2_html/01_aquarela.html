<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lago em aquarela</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
(() => {
const W = 1080, H = 1920, T = 6000, TAU = Math.PI * 2;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * s) + 'px'; cv.style.height = (H * s) + 'px';
}
addEventListener('resize', fit); fit();

/* ---------- aleatório com semente ---------- */
let seed = 20261113;
function rnd() {
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function gauss() { let u = 0; while (!u) u = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * rnd()); }
const R = (a, b) => a + (b - a) * rnd();

/* ---------- ferramentas de aquarela ---------- */
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; }
function poly(cx, cy, r, n, ry, rot) {
  ry = ry == null ? r : ry; rot = rot || 0; const p = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU, x = Math.cos(a) * r, y = Math.sin(a) * ry;
    p.push([cx + x * Math.cos(rot) - y * Math.sin(rot), cy + x * Math.sin(rot) + y * Math.cos(rot)]);
  }
  return p;
}
function deform(pts, depth, v) {
  let p = pts;
  for (let d = 0; d < depth; d++) {
    const o = [];
    for (let i = 0; i < p.length; i++) {
      const a = p[i], b = p[(i + 1) % p.length];
      o.push(a);
      const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
      o.push([(a[0] + b[0]) / 2 + gauss() * len * v, (a[1] + b[1]) / 2 + gauss() * len * v]);
    }
    p = o;
  }
  return p;
}
function addPath(c, p) { c.moveTo(p[0][0], p[0][1]); for (let i = 1; i < p.length; i++) c.lineTo(p[i][0], p[i][1]); c.closePath(); }
function path(c, p) { c.beginPath(); addPath(c, p); }
// camadas finas e irregulares sobrepostas = véu de tinta com borda que vaza
function wash(c, pts, col, o) {
  o = o || {};
  const layers = o.layers || 16, al = o.alpha || 0.07, v = o.v == null ? 0.3 : o.v;
  const base = deform(pts, o.d1 == null ? 2 : o.d1, v);
  c.save();
  c.fillStyle = col; c.globalCompositeOperation = o.blend || 'source-over';
  for (let i = 0; i < layers; i++) {
    const p = deform(base, o.d2 == null ? 2 : o.d2, v * 0.7);
    c.globalAlpha = al; path(c, p); c.fill();
    if (o.edge && i % 3 === 0) { c.globalAlpha = o.edge; c.strokeStyle = o.edgeCol || col; c.lineWidth = o.ew || 1.4; c.stroke(); }
  }
  c.restore();
}
// pinta numa folha à parte e aplica borrada (molhado no molhado)
function soft(c, w, h, ox, oy, blur, blend, alpha, fn) {
  const t = mk(w, h), x = t.getContext('2d'); x.translate(-ox, -oy); fn(x);
  c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.filter = 'blur(' + blur + 'px)';
  c.globalCompositeOperation = blend || 'source-over'; c.globalAlpha = alpha == null ? 1 : alpha;
  c.drawImage(t, 0, 0); c.restore();
}
function stroke(c, pts, col, w, a) {
  c.save(); c.strokeStyle = col; c.lineWidth = w; c.globalAlpha = a; c.lineCap = 'round'; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]); c.stroke(); c.restore();
}
function wobbleLine(x0, y0, x1, y1, n, amp) {
  const p = []; const nx = -(y1 - y0), ny = x1 - x0, l = Math.hypot(nx, ny) || 1;
  for (let i = 0; i <= n; i++) { const s = i / n, w = gauss() * amp * Math.sin(Math.PI * s); p.push([x0 + (x1 - x0) * s + nx / l * w, y0 + (y1 - y0) * s + ny / l * w]); }
  return p;
}

/* =========================================================
   CAMADA 0 — fundo do lago (água de igapó, reflexo da mata)
   ========================================================= */
const BX = -100, BY = -130, BW = 1280, BH = 2180;
const bg = mk(BW, BH);
(function paintBg() {
  const b = bg.getContext('2d'); b.translate(-BX, -BY);
  b.fillStyle = '#c7ddd2'; b.fillRect(BX, BY, BW, BH);
  const g = b.createLinearGradient(0, BY, 0, BY + BH);
  g.addColorStop(0, '#6f9a7c'); g.addColorStop(0.3, '#93b9a7'); g.addColorStop(0.65, '#8fb3b0'); g.addColorStop(1, '#7896b0');
  b.globalCompositeOperation = 'multiply'; b.fillStyle = g; b.fillRect(BX, BY, BW, BH); b.globalCompositeOperation = 'source-over';
  // véus molhados: chá de igapó, verde-seiva, índigo
  soft(b, BW, BH, BX, BY, 26, 'multiply', 1, x => {
    const cols = ['#d2ad7c', '#9fbd77', '#8ea0c4', '#6f9f98', '#c99d70', '#7f9cb8'];
    for (let i = 0; i < 34; i++) {
      const cx = R(BX, BX + BW), cy = R(BY, BY + BH), r = R(120, 340);
      wash(x, poly(cx, cy, r, 10, r * R(0.5, 1), R(0, 3)), cols[i % cols.length], { layers: 7, alpha: 0.11, v: 0.35 });
    }
  });
  // reflexo da mata no alto, em couve-flor
  soft(b, BW, BH, BX, BY, 6, 'multiply', 0.9, x => {
    for (let i = 0; i < 16; i++) {
      const cx = BX + i * 85 + R(-30, 30), cy = R(-110, 120), r = R(90, 170);
      wash(x, poly(cx, cy, r, 12, r * 0.8), i % 3 ? '#557d5c' : '#6b7d4c', { layers: 10, alpha: 0.09, v: 0.4, edge: 0.12, edgeCol: '#2f4d3a' });
    }
    for (let i = 0; i < 7; i++) {
      const cy = R(300, 1700), cx = (i % 2 ? BX + 40 : BX + BW - 40);
      wash(x, poly(cx, cy, R(90, 150), 12), '#62866a', { layers: 8, alpha: 0.08, v: 0.4 });
    }
  });
  // raízes e galhos submersos
  soft(b, BW, BH, BX, BY, 9, 'multiply', 0.55, x => {
    for (let i = 0; i < 9; i++) {
      const x0 = R(BX, BX + BW), y0 = R(BY, BY + BH), a = R(0, TAU), L = R(250, 600);
      const p = wobbleLine(x0, y0, x0 + Math.cos(a) * L, y0 + Math.sin(a) * L, 12, 40);
      stroke(x, p, '#4a6150', R(10, 22), 0.6);
      const m = p[6]; stroke(x, wobbleLine(m[0], m[1], m[0] + R(-160, 160), m[1] + R(-160, 160), 6, 18), '#4a6150', 8, 0.5);
    }
  });
  // véus de borda dura: a tinta secou e deixou a linha escura da poça
  for (let i = 0; i < 14; i++) {
    const cx = R(BX + 60, BX + BW - 60), cy = R(BY + 200, BY + BH - 60), r = R(110, 260);
    wash(b, poly(cx, cy, r, 22, r * R(0.45, 0.9), R(0, 3)), ['#7fa69a', '#a4b88a', '#7d92b0', '#b49a78'][i % 4],
      { layers: 6, alpha: 0.1, v: 0.16, d1: 2, d2: 3, blend: 'multiply', edge: 0.16, edgeCol: '#3f6266', ew: 1.6 });
  }
  // reflexos claros do céu (papel poupado)
  soft(b, BW, BH, BX, BY, 22, 'screen', 0.55, x => {
    for (let i = 0; i < 6; i++) {
      const cx = R(0, W), cy = R(200, 1800);
      wash(x, poly(cx, cy, R(220, 380), 10, R(40, 80), -0.35), '#f3f7ef', { layers: 6, alpha: 0.18, v: 0.3 });
    }
  });
  // granulação do pigmento
  for (let i = 0; i < 9000; i++) {
    b.fillStyle = rnd() < 0.7 ? 'rgba(38,62,70,0.13)' : 'rgba(120,80,40,0.12)';
    const s = R(0.8, 2.4); b.fillRect(R(BX, BX + BW), R(BY, BY + BH), s, s);
  }
})();

/* =========================================================
   PEIXES — acarás vistos de cima, pintados por camadas
   ========================================================= */
const UP = [[0.5, 0], [0.48, 0.05], [0.43, 0.095], [0.35, 0.135], [0.22, 0.165], [0.08, 0.172], [-0.06, 0.155], [-0.18, 0.115], [-0.29, 0.055]];
function bodyPts(L) {
  const p = UP.map(q => [q[0] * L, q[1] * L]);
  for (let i = UP.length - 1; i > 0; i--) p.push([UP[i][0] * L, -UP[i][1] * L]);
  return p;
}
const TAIL = (() => { const p = [[-0.24, 0.05]]; for (let i = 0; i <= 16; i++) { const a = Math.PI - 0.62 + i / 16 * 1.24, r = 0.3 - 0.025 * Math.cos((i / 16) * TAU); p.push([-0.27 + Math.cos(a) * r, Math.sin(a) * r * 0.95]); } p.push([-0.24, -0.05]); return p; })();
const PEC = [[0.27, 0.13], [0.22, 0.25], [0.13, 0.31], [0.07, 0.28], [0.13, 0.17]];
const PEL = [[0.08, 0.15], [0.02, 0.23], [-0.05, 0.22], [-0.02, 0.14]];
const SPECIES = {
  disco: { body: '#e8642e', back: '#b8302a', fin: '#f08a4a', finEdge: '#1f8fa3', edge: '#8a2a20', eye: '#d9452a' },
  dourado: { body: '#f2c23c', back: '#d98a24', fin: '#f2a43a', finEdge: '#c0452a', edge: '#9a5a1a', eye: '#c43a2a' },
  acu: { body: '#857c43', back: '#4f4a2a', fin: '#6e6a3c', finEdge: '#3c3a22', edge: '#3a3520', eye: '#e8892b' },
  azul: { body: '#45aed0', back: '#245f86', fin: '#6fd0e6', finEdge: '#d9442e', edge: '#1d4a6a', eye: '#e8b23a' }
};
function makeFish(kind, L) {
  const sp = SPECIES[kind];
  const cw = Math.ceil(L * 1.22), ch = Math.ceil(L * 0.72);
  const ox = cw * 0.53, oy = ch / 2;
  const c = mk(cw, ch), x = c.getContext('2d');
  x.translate(ox, oy);
  const S = a => a.map(q => [q[0] * L, q[1] * L]);
  const M = a => a.map(q => [q[0] * L, -q[1] * L]);
  // nadadeiras translúcidas com raios
  // pigmento do corpo vazando na água em volta (molhado no molhado)
  soft(x, cw, ch, -ox, -oy, 7, 'source-over', 0.35, y => wash(y, bodyPts(L * 1.05), sp.body, { layers: 5, alpha: 0.2, v: 0.08 }));
  const finWash = (pts, col, al) => wash(x, pts, col, { layers: 8, alpha: al || 0.065, v: 0.1, d1: 1, edge: 0.2, edgeCol: sp.finEdge });
  for (const f of [S(PEC), M(PEC), S(PEL), M(PEL)]) finWash(f, sp.fin);
  finWash(S(TAIL), sp.fin, 0.075);
  finWash(S([[-0.25, 0.04], [-0.38, 0.09], [-0.4, 0], [-0.38, -0.09], [-0.25, -0.04]]), sp.body, 0.1);
  for (let i = 0; i <= 12; i++) {
    const a = Math.PI - 0.58 + i / 12 * 1.16, r = 0.29;
    stroke(x, [[-0.27 * L, 0], [(-0.27 + Math.cos(a) * r * 0.5) * L, Math.sin(a) * r * 0.5 * L], [(-0.27 + Math.cos(a) * r) * L, Math.sin(a) * r * 0.95 * L]], sp.finEdge, 1.1, 0.45);
  }
  for (const s of [1, -1]) for (let i = 0; i < 6; i++) {
    stroke(x, [[0.17 * L, s * 0.16 * L], [(0.21 - i * 0.025) * L, s * (0.25 + i * 0.01) * L]], sp.finEdge, 1, 0.35);
  }
  // corpo
  const body = bodyPts(L);
  wash(x, body, sp.body, { layers: 18, alpha: 0.16, v: 0.04, d1: 1 });
  x.save(); path(x, deform(body, 1, 0.02)); x.clip();
  // dorso mais escuro (glacis)
  wash(x, [[0.42 * L, 0], [0.2 * L, 0.06 * L], [-0.1 * L, 0.05 * L], [-0.3 * L, 0.02 * L], [-0.3 * L, -0.02 * L], [-0.1 * L, -0.05 * L], [0.2 * L, -0.06 * L]], sp.back, { layers: 10, alpha: 0.1, v: 0.08, blend: 'multiply' });
  if (kind === 'disco') {
    for (let j = -3; j <= 3; j++) {
      if (!j) continue;
      const p = []; for (let i = 0; i <= 24; i++) { const u = 0.36 - i / 24 * 0.66; p.push([u * L, (j * 0.042 + 0.012 * Math.sin(u * 30 + j)) * L]); }
      stroke(x, p, '#2aa3b2', L * 0.016, 0.7);
    }
  } else if (kind === 'acu') {
    for (let i = 0; i < 11; i++) {
      const cx = R(-0.25, 0.35) * L, cy = R(-0.14, 0.14) * L;
      wash(x, poly(cx, cy, R(0.03, 0.06) * L, 8, R(0.02, 0.04) * L, R(0, 3)), '#f0862c', { layers: 7, alpha: 0.16, v: 0.25, edge: 0.2, edgeCol: '#b85a1a' });
    }
  } else if (kind === 'dourado') {
    for (let i = 0; i < 26; i++) {
      const u = R(-0.25, 0.36), w = 0.15 * Math.sqrt(Math.max(0, 1 - Math.pow((u - 0.05) / 0.45, 2)));
      wash(x, poly(u * L, R(-w, w) * L, R(0.008, 0.015) * L, 7), '#2b56a6', { layers: 5, alpha: 0.22, v: 0.2 });
    }
  } else if (kind === 'azul') {
    for (let i = 0; i < 6; i++) {
      const u = 0.28 - i * 0.1;
      wash(x, poly(u * L, 0, 0.022 * L, 10, 0.2 * L), '#1f4e78', { layers: 7, alpha: 0.12, v: 0.15, blend: 'multiply' });
    }
  }
  // luz poupada: papel aparecendo de um lado da cabeça
  wash(x, poly(0.22 * L, -0.09 * L, 0.16 * L, 10, 0.035 * L, -0.12), '#fff8e8', { layers: 6, alpha: 0.12, v: 0.2 });
  x.restore();
  // borda escura onde a tinta secou
  path(x, deform(body, 2, 0.015)); x.strokeStyle = sp.edge; x.globalAlpha = 0.45; x.lineWidth = 1.6; x.stroke(); x.globalAlpha = 1;
  // espinha dorsal: crista de raios
  const dorsal = []; for (let i = 0; i <= 14; i++) { const u = 0.3 - i / 14 * 0.6; dorsal.push([u * L, gauss() * 0.6]); }
  stroke(x, dorsal, sp.back, L * 0.022, 0.45);
  for (let i = 0; i < 16; i++) { const u = 0.28 - i * 0.036; stroke(x, [[u * L, -4], [(u - 0.03) * L, 0], [u * L, 4]], sp.edge, 1, 0.35); }
  // olhos
  for (const s of [1, -1]) {
    const ex = 0.39 * L, ey = s * 0.09 * L;
    x.fillStyle = '#f7efdc'; x.beginPath(); x.arc(ex, ey, 0.026 * L, 0, TAU); x.fill();
    x.fillStyle = sp.eye; x.globalAlpha = 0.85; x.beginPath(); x.arc(ex + 1, ey, 0.019 * L, 0, TAU); x.fill();
    x.fillStyle = '#1b1a22'; x.globalAlpha = 0.9; x.beginPath(); x.arc(ex + 1.5, ey, 0.011 * L, 0, TAU); x.fill(); x.globalAlpha = 1;
  }
  if (kind === 'acu') { // ocelo no pedúnculo
    x.fillStyle = '#f08a2a'; x.globalAlpha = 0.85; x.beginPath(); x.arc(-0.27 * L, 0, 0.035 * L, 0, TAU); x.fill();
    x.fillStyle = '#1e1c16'; x.beginPath(); x.arc(-0.27 * L, 0, 0.018 * L, 0, TAU); x.fill(); x.globalAlpha = 1;
  }
  // versão funda (desfocada e tingida de água) e sombra
  const deep = mk(cw, ch), d = deep.getContext('2d');
  d.filter = 'blur(2.5px)'; d.drawImage(c, 0, 0); d.filter = 'none';
  d.globalCompositeOperation = 'source-atop'; d.fillStyle = '#5f8f8a'; d.globalAlpha = 0.35; d.fillRect(0, 0, cw, ch);
  const sh = mk(cw + 40, ch + 40), s2 = sh.getContext('2d');
  const sil = mk(cw, ch), s1 = sil.getContext('2d'); s1.drawImage(c, 0, 0); s1.globalCompositeOperation = 'source-in'; s1.fillStyle = '#1d3a40'; s1.fillRect(0, 0, cw, ch);
  s2.filter = 'blur(9px)'; s2.drawImage(sil, 20, 20);
  return { c, deep, sh, cw, ch, ox, oy, L };
}

/* =========================================================
   VITÓRIAS-RÉGIAS, flor e pétalas
   ========================================================= */
function makePad(Rr) {
  const S = Math.ceil(Rr * 2 + 50), c = mk(S, S), x = c.getContext('2d'), C = S / 2;
  const notch = R(0, TAU), w1 = R(0, TAU), w2 = R(0, TAU);
  const outline = (r, n) => {
    n = n || 90; const p = [];
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU; let dd = Math.abs(((a - notch + Math.PI * 3) % TAU) - Math.PI);
      const k = Math.max(0, 1 - dd / 0.07), q = (1 - 0.42 * k) * (1 + 0.012 * Math.sin(3 * a + w1) + 0.007 * Math.sin(7 * a + w2));
      p.push([C + Math.cos(a) * r * q, C + Math.sin(a) * r * q]);
    }
    return p;
  };
  // parede da borda: o avesso vermelho aparece
  wash(x, outline(Rr), '#9c3a46', { layers: 12, alpha: 0.15, v: 0.07, d1: 1, d2: 2, edge: 0.3, edgeCol: '#5e1b29', ew: 2 });
  // folha
  const leafCol = ['#b4cb5e', '#a9c55a', '#bccb60', '#9fc06a'][Math.floor(rnd() * 4)];
  wash(x, outline(Rr * 0.93), leafCol, { layers: 16, alpha: 0.17, v: 0.06, d1: 1, d2: 2 });
  x.save(); path(x, outline(Rr * 0.93)); x.clip();
  // poças de pigmento com borda dura e retorno de água (couve-flor)
  for (let i = 0; i < 5; i++) {
    const a = R(0, TAU), r = R(0.1, 0.65) * Rr, cx = C + Math.cos(a) * r, cy = C + Math.sin(a) * r, rr = R(0.12, 0.26) * Rr;
    wash(x, poly(cx, cy, rr, 9, rr * R(0.6, 1), R(0, 3)), i % 2 ? '#86a84a' : '#9a9a4c', { layers: 5, alpha: 0.1, v: 0.35, blend: 'multiply', edge: 0.28, edgeCol: '#5f7a32', ew: 1.6 });
  }
  if (rnd() < 0.6) { const a = R(0, TAU), r = R(0.4, 0.7) * Rr; wash(x, poly(C + Math.cos(a) * r, C + Math.sin(a) * r, Rr * 0.2, 10), '#b0603a', { layers: 6, alpha: 0.08, v: 0.4, blend: 'multiply' }); }
  for (let i = 0; i < 2; i++) {
    const a = R(0, TAU), r = R(0.2, 0.6) * Rr, cx = C + Math.cos(a) * r, cy = C + Math.sin(a) * r;
    wash(x, poly(cx, cy, R(0.08, 0.14) * Rr, 12), '#e6edb0', { layers: 5, alpha: 0.2, v: 0.4, edge: 0.3, edgeCol: '#6f8f3a', ew: 1.4 });
  }
  for (let i = 0; i < Rr * 6; i++) { const a = R(0, TAU), r = Math.sqrt(rnd()) * Rr; x.fillStyle = 'rgba(60,80,30,0.18)'; const s = R(0.8, 2); x.fillRect(C + Math.cos(a) * r, C + Math.sin(a) * r, s, s); }
  // sombra do lado oposto à luz
  const g = x.createRadialGradient(C - Rr * 0.35, C - Rr * 0.4, Rr * 0.1, C, C, Rr * 1.05);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(70,110,60,0.55)');
  x.globalCompositeOperation = 'multiply'; x.fillStyle = g; x.fillRect(0, 0, S, S); x.globalCompositeOperation = 'source-over';
  soft(x, S, S, 0, 0, 8, 'multiply', 0.8, y => {
    for (let i = 0; i < 7; i++) { const a = R(0, TAU), r = R(0.1, 0.7) * Rr; wash(y, poly(C + Math.cos(a) * r, C + Math.sin(a) * r, R(0.15, 0.3) * Rr, 9), i % 2 ? '#7ea548' : '#a8a050', { layers: 6, alpha: 0.12, v: 0.35 }); }
  });
  // nervuras radiais e células acolchoadas
  const nv = 20, rings = [0.28, 0.46, 0.62, 0.76, 0.88];
  const ang = []; for (let i = 0; i < nv; i++) ang.push(i / nv * TAU + R(-0.05, 0.05));
  for (const a of ang) stroke(x, wobbleLine(C, C, C + Math.cos(a) * Rr * 0.92, C + Math.sin(a) * Rr * 0.92, 10, 1.8), '#4f7d34', R(1.6, 2.6), 0.45);
  for (const rr of rings) for (let i = 0; i < nv; i++) {
    const a0 = ang[i], a1 = ang[(i + 1) % nv] + (i === nv - 1 ? TAU : 0), am = (a0 + a1) / 2, r = rr * Rr;
    x.save(); x.strokeStyle = '#557f36'; x.globalAlpha = 0.22; x.lineWidth = 1.3; x.beginPath();
    x.moveTo(C + Math.cos(a0) * r, C + Math.sin(a0) * r);
    x.quadraticCurveTo(C + Math.cos(am) * r * 0.93, C + Math.sin(am) * r * 0.93, C + Math.cos(a1) * r, C + Math.sin(a1) * r); x.stroke(); x.restore();
  }
  x.restore();

function makePaper() {
  const tex = mk(W, H), x = tex.getContext('2d');
  const id = x.createImageData(W, H), d = id.data;
  for (let i = 0; i < d.length; i += 4) { const v = 255 - Math.pow(rnd(), 2.2) * 34; d[i] = v; d[i + 1] = v - 1; d[i + 2] = v - 5; d[i + 3] = 255; }

  const sm = mk(W / 6, H / 6), y = sm.getContext('2d'), id2 = y.createImageData(sm.width, sm.height), e = id2.data;
  for (let i = 0; i < e.length; i += 4) { const v = 255 - Math.pow(rnd(), 1.6) * 26; e[i] = v; e[i + 1] = v; e[i + 2] = v - 3; e[i + 3] = 255; }
  y.putImageData(id2, 0, 0);

  // fibras

  f.save(); path(f, edge); f.strokeStyle = 'rgba(28,60,70,0.55)'; f.lineWidth = 5; f.filter = 'blur(1.4px)'; f.stroke(); f.restore();
  f.save(); path(f, edge); f.strokeStyle = 'rgba(28,60,70,0.25)'; f.lineWidth = 16; f.filter = 'blur(6px)'; f.stroke(); f.restore();
  f.beginPath(); f.rect(0, 0, W, H); addPath(f, edge); f.fillStyle = '#f5f0e4'; f.fill('evenodd');
  // respingos
  const spl = ['#2b8f9e', '#e8692f', '#5f8f3a', '#c2386e', '#2c5c74'];
  for (let k = 0; k < 5; k++) {
    const cx = [80, W - 90, 120, W - 140, W / 2][k], cy = [140, 1780, 1650, 260, H - 50][k], col = spl[k];

  }

  return { tex, frame };
}

/* =========================================================

function draw(ts) {

  // 0 — fundo

  ctx.drawImage(bg, BX, BY);
  const fish = fishList(t);

  // 1 — sombras dos peixes no fundo
  layer(0.45); ctx.globalCompositeOperation = 'multiply';
  for (const f of fish) {
    const s = fishArt[f.l.kind].sh, A = fishArt[f.l.kind];
    ctx.globalAlpha = f.l.deep ? 0.22 : 0.32;
    const d = f.l.deep ? 18 : 40;

    for (const [rr, al] of [[r1, 1], [r1 * 0.58, 0.7]]) {
      const sc = rr / RING_R; ctx.globalAlpha = fade * al;
      ctx.drawImage(ringDark, e.x - 300 * sc, e.y - 300 * sc, 600 * sc, 600 * sc);
    }
    ctx.globalCompositeOperation = 'source-over';
    for (const [rr, al] of [[r1 * 0.95, 0.55], [r1 * 0.6, 0.4]]) {
      const sc = rr / RING_R; ctx.globalAlpha = fade * al;
      ctx.drawImage(ringLight, e.x - 300 * sc, e.y - 300 * sc, 600 * sc, 600 * sc);
    }
  }
  // sombras das folhas grandes e das vitórias-régias
  ctx.globalCompositeOperation = 'multiply';
  for (const p of PADS) { const s = p.r / 110 * 1.05; ctx.globalAlpha = 0.38; ctx.drawImage(shadowDisc, p.x + 22 - 150 * s, p.y + 34 - 150 * s, 300 * s, 300 * s); }
  for (const g of FG) {
    ctx.globalAlpha = 0.28; ctx.save(); ctx.translate(g.x + 120, g.y + 170); ctx.rotate(g.rot + 0.03 * Math.sin(a + g.ph));
    ctx.drawImage(g.sh, -g.a.ax - 30, -g.a.ay - 30); ctx.restore();
  }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  for (const p of PADS) {
    ctx.save(); ctx.translate(p.x + 5 * Math.sin(a + p.ph), p.y + 4 * Math.cos(a + p.ph)); ctx.rotate(0.012 * Math.sin(a + p.ph2));
    ctx.drawImage(p.c, -p.S / 2, -p.S / 2); ctx.restore();
  }
  for (const fl of FLOWERS) {
    ctx.save(); ctx.translate(fl.x + 6 * Math.sin(a + fl.ph), fl.y + 5 * Math.cos(a + fl.ph)); ctx.rotate(0.05 * Math.sin(a + fl.ph));
    const s = 1 + 0.015 * Math.sin(2 * a + fl.ph); ctx.scale(s, s);
    ctx.drawImage(fl.c, -fl.S / 2, -fl.S / 2); ctx.restore();
  }
  for (const pt of PETALS) {
    ctx.save(); ctx.translate(pt.x + pt.ax * Math.sin(a + pt.ph), pt.y + pt.ay * Math.sin(2 * a + pt.ph)); ctx.rotate(pt.ph + 0.6 * Math.sin(a + pt.ph));
    ctx.drawImage(pt.c, -pt.c.width / 2, -pt.c.height / 2); ctx.restore();
  }
  // brilhos: papel poupado que pisca na água
  ctx.fillStyle = '#fbf8ef';
  for (const s of SPARK) {
    const v = Math.max(0, Math.sin(TAU * (s.n * t / T + s.ph))); const al = Math.pow(v, 6) * 0.9; if (al < 0.02) continue;
    ctx.globalAlpha = al; ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.a); ctx.beginPath(); ctx.ellipse(0, 0, s.l, 2.2, 0, 0, TAU); ctx.fill(); ctx.restore();
  }
  ctx.globalAlpha = 1;

  // 5 — primeiro plano desfocado
  layer(1.7);
  for (const g of FG) {
    ctx.globalAlpha = 0.9; ctx.save(); ctx.translate(g.x, g.y); ctx.rotate(g.rot + 0.03 * Math.sin(a + g.ph));
    ctx.drawImage(g.a.c, -g.a.ax, -g.a.ay); ctx.restore();
  }
  ctx.globalAlpha = 1;

  // papel por cima de tudo (fixo: a tinta anda, o papel fica)
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(paper.frame, 0, 0);
  ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = 0.85; ctx.drawImage(paper.tex, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}
function loop(ts) { draw(ts); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
})();
</script>
