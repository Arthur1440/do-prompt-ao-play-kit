<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guache noturno</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
(() => {
const W = 1080, H = 1920, LOOP = 6000, TAU = Math.PI * 2;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * s) + 'px'; cv.style.height = (H * s) + 'px';
}
addEventListener('resize', fit); fit();

// ---------- utilidades ----------
function rng(seed) {
  let a = seed >>> 0;
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const pick = (r, a) => a[Math.floor(r() * a.length)];
const frac = x => x - Math.floor(x);
function hex(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(a, b, t) { const A = hex(a), B = hex(b);
  return `rgb(${Math.round(A[0] + (B[0] - A[0]) * t)},${Math.round(A[1] + (B[1] - A[1]) * t)},${Math.round(A[2] + (B[2] - A[2]) * t)})`; }

// pincelada de guache: corpo opaco + cerdas secas
function brush(g, x1, y1, x2, y2, w, col, a, r, col2) {
  g.save(); g.lineCap = 'round'; g.globalAlpha = a; g.strokeStyle = col;
  const mx = (x1 + x2) / 2 + (r() - .5) * w * 1.2, my = (y1 + y2) / 2 + (r() - .5) * w * 1.2;
  g.lineWidth = w; g.beginPath(); g.moveTo(x1, y1); g.quadraticCurveTo(mx, my, x2, y2); g.stroke();
  g.globalAlpha = a * .55; g.strokeStyle = col2 || col;
  for (let i = 0; i < 3; i++) {
    const o = (r() - .5) * w * .9;
    g.lineWidth = w * (.12 + r() * .18);
    g.beginPath(); g.moveTo(x1 + (r() - .5) * w * .3, y1 + o);
    g.quadraticCurveTo(mx, my + o, x2 + (r() - .5) * w * .8, y2 + o * (.6 + r() * .6)); g.stroke();
  }
  g.restore();
}
// mancha irregular (borda de pincel)
function blobPath(g, cx, cy, rx, ry, r, n = 14, j = .14) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU, k = 1 + (r() - .5) * 2 * j;
    pts.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]);
  }
  g.beginPath();
  const m0 = [(pts[0][0] + pts[n - 1][0]) / 2, (pts[0][1] + pts[n - 1][1]) / 2];
  g.moveTo(m0[0], m0[1]);
  for (let i = 0; i < n; i++) {
    const p = pts[i], q = pts[(i + 1) % n];
    g.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
  }
  g.closePath();
}
function leaf(g, x, y, len, wid, ang, col, hi, curl = 0, hiA = .6) {
  g.save(); g.translate(x, y); g.rotate(ang);
  const tipY = curl * len * .18;
  g.beginPath(); g.moveTo(0, 0);
  g.quadraticCurveTo(len * .42, -wid + curl * len * .1, len, tipY);
  g.quadraticCurveTo(len * .48, wid * .95 + curl * len * .12, 0, 0);
  g.fillStyle = col; g.fill();
  if (len > 40) {
    const rr = rng(Math.floor(Math.abs(x * 13 + y * 7 + len * 3)));
    g.save(); g.clip();
    for (let k = 0; k < 4; k++) {
      const o = (rr() - .5) * wid * 1.2;
      brush(g, len * (.05 + rr() * .2), o, len * (.55 + rr() * .4), o * .5 + curl * len * .1, wid * (.25 + rr() * .3), rr() < .5 ? (hi || col) : '#02080a', .14 + rr() * .1, rr);
    }
    g.restore();
  }
  if (hi) {
    g.lineCap = 'round'; g.strokeStyle = hi;
    g.globalAlpha = hiA; g.lineWidth = Math.max(2, wid * .16);
    g.beginPath(); g.moveTo(len * .12, -wid * .38);
    g.quadraticCurveTo(len * .46, -wid * .82 + curl * len * .1, len * .9, tipY * .95); g.stroke();
    g.globalAlpha = hiA * .7; g.lineWidth = Math.max(1.5, wid * .07);
    g.beginPath(); g.moveTo(len * .04, 0);
    g.quadraticCurveTo(len * .5, curl * len * .12 + wid * .05, len * .93, tipY); g.stroke();
  }
  g.restore();
}
// fronde de palmeira / samambaia
function frond(g, x, y, len, ang, droop, col, hi, r, lw = .32, wd = 9, dens = 22, hiA = .55) {
  let px = x, py = y, a = ang;
  const step = len / dens, pts = [];
  for (let i = 0; i <= dens; i++) {
    const s = i / dens; pts.push([px, py, a, s]);
    a = ang + droop * s * s; px += Math.cos(a) * step; py += Math.sin(a) * step;
  }
  g.save(); g.strokeStyle = col; g.lineCap = 'round'; g.lineWidth = Math.max(2, wd * .45);
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (const p of pts) g.lineTo(p[0], p[1]); g.stroke(); g.restore();
  for (let i = 2; i < pts.length; i++) {
    const [qx, qy, qa, s] = pts[i];
    const L = len * lw * (1 - s * .65) * (.85 + r() * .3);
    const w = wd * (1 - s * .5);
    leaf(g, qx, qy, L, w, qa - 1.05 - r() * .2, col, hi, .5, hiA);
    leaf(g, qx, qy, L, w, qa + 1.05 + r() * .2, col, hi, -.5, hiA * .5);
  }
}
function tiled(TW, items, g) {
  for (const it of items) for (const dx of [-TW, 0, TW]) {
    if (it.x + dx < -700 || it.x + dx > TW + 700) continue;
    it.fn(g, it.x + dx, rng(it.seed));
  }
}

// ---------- paleta noturna ----------
const P = {
  sky0: '#0a1430', sky1: '#16295a', sky2: '#24466e', sky3: '#2f5c74',
  moon: '#f1e8c9', moonHi: '#fbf5e2', halo: '#5d7fa6',
  far: '#1c3650', farHi: '#335a74', farDk: '#152a40', mist: '#4a6f86',
  trunk: '#11222e', trunkHi: '#3a6070', trunkDk: '#09141b',
  midLeaf: '#14302f', midHi: '#41705f', heli: '#8a3326', heliHi: '#c25a3c',
  ground: '#17261f', path: '#283a2f', pathHi: '#56705c', dirt: '#0f1a16',
  fore: '#07120f', foreHi: '#234538',
  fur: '#c99446', furDk: '#8a5a28', furFar: '#6a4422', belly: '#ddd1b0', ros: '#22140c', rosIn: '#a96d2c',
  fly: '#fff3b0', flyGlow: '#d8ec74'
};

// ---------- camada 0: céu com lua ----------
const SKY = mk(1240, 1560);
(() => {
  const g = SKY.getContext('2d'), r = rng(11);
  const gr = g.createLinearGradient(0, 0, 0, 1560);
  gr.addColorStop(0, P.sky0); gr.addColorStop(.45, P.sky1); gr.addColorStop(.8, P.sky2); gr.addColorStop(1, P.sky3);
  g.fillStyle = gr; g.fillRect(0, 0, 1240, 1560);
  const cols = [P.sky0, P.sky1, P.sky2, P.sky3];
  for (let i = 0; i < 520; i++) {
    const y = r() * 1560, x = r() * 1240, t = y / 1560 * 3;
    const i0 = Math.min(2, Math.floor(t));
    const c = mix(cols[i0], cols[i0 + 1], Math.min(1, Math.max(0, t - i0 + (r() - .5) * .9)));
    const L = 120 + r() * 300;
    brush(g, x, y, x + L, y + (r() - .5) * 30, 26 + r() * 46, c, .35 + r() * .35, r);
  }
  const mx = 790, my = 330;
  // halo pintado em anéis
  for (let k = 0; k < 6; k++) {
    const rad = 330 - k * 38;
    g.save(); g.globalAlpha = .1 + k * .035; g.fillStyle = mix('#203f6c', '#9fb8c8', k / 6);
    blobPath(g, mx, my, rad, rad, r, 22, .04); g.fill(); g.restore();
  }
  for (let i = 0; i < 160; i++) {
    const a = r() * TAU, rad = 150 + r() * 160;
    const x = mx + Math.cos(a) * rad, y = my + Math.sin(a) * rad, ta = a + Math.PI / 2;
    brush(g, x, y, x + Math.cos(ta) * 60, y + Math.sin(ta) * 60, 14 + r() * 16, mix('#3a5f8a', '#a8bfcc', 1 - (rad - 150) / 160), .18, r);
  }
  // disco da lua
  g.fillStyle = P.moon; blobPath(g, mx, my, 128, 128, r, 26, .02); g.fill();
  g.save(); blobPath(g, mx, my, 128, 128, r, 26, .02); g.clip();
  for (let i = 0; i < 70; i++) {
    const x = mx - 130 + r() * 260, y = my - 130 + r() * 260;
    brush(g, x, y, x + 30 + r() * 50, y + (r() - .5) * 20, 10 + r() * 18, pick(r, ['#fbf5e2', '#e2dbbd', '#d5d0b8', '#f6eed2']), .5, r);
  }
  g.globalAlpha = .35; g.fillStyle = '#b9b7a2';
  for (let i = 0; i < 6; i++) { blobPath(g, mx - 60 + r() * 120, my - 60 + r() * 120, 14 + r() * 22, 12 + r() * 18, r); g.fill(); }
  g.globalAlpha = .4; g.fillStyle = '#8d9fb0'; g.beginPath(); g.arc(mx - 40, my + 30, 130, 0, TAU); g.arc(mx - 10, my + 5, 128, 0, TAU, true); g.fill();
  g.restore();
  // estrelas como respingos
  for (let i = 0; i < 90; i++) {
    const x = r() * 1240, y = r() * 900;
    if (Math.hypot(x - mx, y - my) < 260) continue;
    g.globalAlpha = .4 + r() * .5; g.fillStyle = pick(r, ['#dfe6ef', '#f4ecc8', '#b9cbe0']);
    blobPath(g, x, y, 1.5 + r() * 3, 1.5 + r() * 3, r, 6, .3); g.fill();
  }
  g.globalAlpha = 1;
})();

// ---------- camada 1: copas distantes (tile 1200, 200 px/s) ----------
const FAR_W = 1200, FAR = mk(FAR_W, 1100), FAR_Y = 430;
(() => {
  const g = FAR.getContext('2d'), items = [];
  let s = 1;
  for (let x = 0; x < FAR_W; x += 70 + (s * 37 % 50)) {
    const seed = 100 + s++;
    items.push({ x, seed, fn: (g, x, r) => {
      const cy = 330 + r() * 190, rad = 80 + r() * 90;
      g.fillStyle = P.far;
      blobPath(g, x, cy, rad, rad * .8, r, 16, .2); g.fill();
      blobPath(g, x + rad * .5, cy + 20, rad * .7, rad * .6, r, 14, .2); g.fill();
      g.fillRect(x - rad * .9, cy + 10, rad * 1.8, 1100);
      for (let k = 0; k < 9; k++) {
        const a = -1.2 + r() * 1.1, rr = rad * (.55 + r() * .4);
        const px = x + Math.cos(a) * rr, py = cy + Math.sin(a) * rr * .8;
        brush(g, px - 22, py + 6, px + 18, py - 4, 10 + r() * 12, P.farHi, .55, r);
      }
    }});
  }
  for (const px of [260, 840]) {
    const seed = 900 + px;
    items.push({ x: px, seed, fn: (g, x, r) => {
      const top = 120 + r() * 80, lean = (r() - .5) * 80;
      g.strokeStyle = P.farDk; g.lineWidth = 12; g.lineCap = 'round';
      g.beginPath(); g.moveTo(x, 700); g.quadraticCurveTo(x + lean, 400, x + lean * .6, top); g.stroke();
      for (let k = 0; k < 8; k++) {
        const a = -Math.PI / 2 + (k - 3.5) * .42;
        frond(g, x + lean * .6, top, 120 + r() * 40, a, (a > -Math.PI / 2 ? 1.4 : -1.4), P.farDk, P.farHi, r, .28, 6, 14, .35);
      }
    }});
  }
  tiled(FAR_W, items, g);
  // névoa pintada na base das copas
  const r = rng(77);
  for (let i = 0; i < 150; i++) {
    const x = r() * FAR_W, y = 380 + Math.pow(r(), .7) * 460;
    for (const dx of [-FAR_W, 0, FAR_W]) brush(g, x + dx, y, x + dx + 220 + r() * 200, y + (r() - .5) * 20, 30 + r() * 40, P.mist, .05 + r() * .06, rng(i * 7 + 1));
  }
  g.globalAlpha = 1;
})();

// ---------- feixe de luar ----------
const BEAM = mk(1300, 1700);
(() => {
  const g = BEAM.getContext('2d'), r = rng(5);
  g.save(); g.translate(900, 0); g.rotate(.32);
  for (let i = 0; i < 4; i++) {
    const x = -520 + i * 150 + r() * 60, w = 60 + r() * 90;
    for (let k = 0; k < 26; k++) {
      const y = k * 70;
      brush(g, x + (r() - .5) * w * .5, y, x + (r() - .5) * w * .5, y + 110, w, '#b8d0d8', .05 + r() * .04, r);
    }
  }
  g.restore();
})();

// ---------- camada 2: troncos, cipós e moitas (tile 1800, 300 px/s) ----------
const MID_W = 1800, MID = mk(MID_W, 1920);
(() => {
  const g = MID.getContext('2d'), items = [];
  const trunks = [[180, 90, 1], [760, 130, 2], [1290, 70, 3], [1560, 105, 4]];
  for (const [tx, tw, sd] of trunks) items.push({ x: tx, seed: 300 + sd, fn: (g, x, r) => {
    const top = -40, bot = 1470 + r() * 20, w = tw, bend = (r() - .5) * 90;
    const path = () => {
      g.beginPath(); g.moveTo(x - w / 2, top);
      g.quadraticCurveTo(x - w / 2 + bend, (top + bot) / 2, x - w * .7, bot - 70);
      g.quadraticCurveTo(x - w * .9, bot - 10, x - w * 1.5, bot + 14);
      g.lineTo(x + w * 1.5, bot + 14);
      g.quadraticCurveTo(x + w * .9, bot - 10, x + w * .7, bot - 70);
      g.quadraticCurveTo(x + w / 2 + bend, (top + bot) / 2, x + w / 2, top); g.closePath();
    };
    g.fillStyle = P.trunk; path(); g.fill();
    g.save(); path(); g.clip();
    for (let y = top; y < bot + 20; y += 60 + r() * 40) {
      const s = (y - top) / (bot - top), c = x + bend * 2 * s * (1 - s);
      for (let k = 0; k < 6; k++) {
        const o = (r() - .5) * w * 1.1, L = 60 + r() * 120;
        const col = o > w * .18 ? P.trunkHi : (o < -w * .2 ? P.trunkDk : '#1a3341');
        brush(g, c + o, y, c + o + (r() - .5) * 8, y + L, 8 + r() * 16, col, o > w * .18 ? .75 : .55, r);
      }
    }
    g.restore();
    // musgo e epífitas
    for (let k = 0; k < 3; k++) {
      const y = 300 + r() * 900, s = (y - top) / (bot - top), c = x + bend * 2 * s * (1 - s);
      for (let j = 0; j < 4; j++) leaf(g, c + (r() - .3) * w * .6, y, 50 + r() * 50, 14, -Math.PI / 2 + (r() - .5) * 2.2, P.midLeaf, P.midHi, .3, .45);
    }
  }});
  // cipós
  for (let i = 0; i < 5; i++) items.push({ x: 100 + i * 360, seed: 500 + i, fn: (g, x, r) => {
    const x2 = x + 200 + r() * 250, sag = 420 + r() * 520;
    g.lineCap = 'round';
    g.strokeStyle = '#0d1c22'; g.lineWidth = 7 + r() * 5;
    g.beginPath(); g.moveTo(x, -10); g.bezierCurveTo(x + 40, sag, x2 - 40, sag, x2, -10); g.stroke();
    g.strokeStyle = '#2f5156'; g.lineWidth = 2.5; g.globalAlpha = .6;
    g.beginPath(); g.moveTo(x + 4, -10); g.bezierCurveTo(x + 44, sag - 6, x2 - 36, sag - 6, x2 + 4, -10); g.stroke();
    g.globalAlpha = 1;
    const hx = x + (x2 - x) * (.3 + r() * .4);
    g.strokeStyle = '#0d1c22'; g.lineWidth = 5;
    g.beginPath(); g.moveTo(hx, sag * .7); g.quadraticCurveTo(hx + 20, sag * .7 + 200, hx - 10, sag * .7 + 300 + r() * 200); g.stroke();
    for (let k = 0; k < 7; k++) leaf(g, hx + (r() - .5) * 30, sag * .7 + 40 + k * 50, 34 + r() * 20, 10, Math.PI / 2 + (r() - .5) * 2, P.midLeaf, P.midHi, .4, .4);
  }});
  // dossel alto
  for (let i = 0; i < 12; i++) items.push({ x: i * 150 + 30, seed: 600 + i, fn: (g, x, r) => {
    for (let k = 0; k < 6; k++) leaf(g, x + (r() - .5) * 120, -20 + r() * 60, 120 + r() * 120, 30 + r() * 20, Math.PI / 2 + (r() - .5) * 1.6, P.midLeaf, P.midHi, (r() - .5), .45);
  }});
  // moitas atrás da onça (bananeira-brava, helicônias)
  for (let i = 0; i < 9; i++) items.push({ x: i * 200 + 60, seed: 700 + i, fn: (g, x, r) => {
    const base = 1470;
    for (let k = 0; k < 5; k++) {
      const a = -Math.PI / 2 + (r() - .5) * 1.8;
      g.strokeStyle = P.midLeaf; g.lineWidth = 8; g.beginPath(); g.moveTo(x, base);
      const L = 150 + r() * 160, ex = x + Math.cos(a) * L * .6, ey = base + Math.sin(a) * L * .6;
      g.lineTo(ex, ey); g.stroke();
      leaf(g, ex, ey, 150 + r() * 120, 34 + r() * 18, a + (r() - .5) * .5, P.midLeaf, P.midHi, (r() - .5) * 1.2, .55);
    }
    if (i % 3 === 1) { // helicônia
      const hx = x + 30, hy = base - 230 - r() * 60;
      g.strokeStyle = '#2f5243'; g.lineWidth = 10; g.beginPath(); g.moveTo(hx, base); g.lineTo(hx, hy - 10); g.stroke();
      for (let k = 0; k < 6; k++) {
        const y = hy + k * 30, sgn = k % 2 ? 1 : -1;
        leaf(g, hx, y, 70 - k * 5, 18, sgn > 0 ? -.35 : Math.PI + .35, P.heli, P.heliHi, -.5 * sgn, .7);
      }
    }
  }});
  tiled(MID_W, items, g);
})();

// ---------- camada 3: chão da trilha (tile 2400, 400 px/s) ----------
const GND_W = 2400, GND = mk(GND_W, 560), GND_Y = 1420, GY = 1500;
(() => {
  const g = GND.getContext('2d'), r = rng(31);
  g.fillStyle = P.ground;
  g.beginPath(); g.moveTo(0, 560);
  const edge = x => 52 + Math.sin(x / GND_W * TAU * 3) * 10 + Math.sin(x / GND_W * TAU * 7 + 1) * 6;
  for (let x = 0; x <= GND_W; x += 20) g.lineTo(x, edge(x));
  g.lineTo(GND_W, 560); g.closePath(); g.fill();
  // trilha iluminada
  for (let i = 0; i < 900; i++) {
    const x = r() * GND_W, y = 70 + Math.pow(r(), 1.4) * 170;
    const col = y < 120 ? pick(r, [P.path, P.path, P.pathHi]) : pick(r, [P.path, P.ground, P.dirt]);
    for (const dx of [-GND_W, 0, GND_W]) brush(g, x + dx, y, x + dx + 60 + r() * 140, y + (r() - .5) * 8, 8 + r() * 14, col, .5 + r() * .3, rng(i + 9));
  }
  for (let i = 0; i < 260; i++) {
    const x = r() * GND_W, y = 240 + r() * 320;
    for (const dx of [-GND_W, 0, GND_W]) brush(g, x + dx, y, x + dx + 80 + r() * 160, y + (r() - .5) * 10, 14 + r() * 20, pick(r, [P.dirt, '#0b1411', P.ground]), .7, rng(i + 3000));
  }
  // folhas caídas e pedrinhas
  const items = [];
  for (let i = 0; i < 70; i++) items.push({ x: r() * GND_W, seed: 4000 + i, fn: (g, x, r) => {
    const y = 80 + r() * 120;
    if (r() < .6) leaf(g, x, y, 18 + r() * 16, 6, (r() - .5) * 1, pick(r, ['#5a4a2e', '#4a3d27', '#3f4a2c']), '#8c7a52', 0, .35);
    else { g.fillStyle = pick(r, ['#6f8576', '#4e6457']); blobPath(g, x, y, 5 + r() * 6, 3 + r() * 4, r, 8, .2); g.fill(); }
  }});
  // tufos de capim atrás da linha das patas
  for (let i = 0; i < 26; i++) items.push({ x: r() * GND_W, seed: 5000 + i, fn: (g, x, r) => {
    const y = 66 + r() * 10;
    for (let k = 0; k < 9; k++) {
      const a = -Math.PI / 2 + (r() - .5) * 1.4, L = 30 + r() * 50;
      brush(g, x, y, x + Math.cos(a) * L, y + Math.sin(a) * L, 4, pick(r, ['#1d3a2c', '#2a4c39', '#46705a']), .85, r);
    }
  }});
  // raízes
  for (let i = 0; i < 6; i++) items.push({ x: i * 400 + r() * 200, seed: 6000 + i, fn: (g, x, r) => {
    const y = 110 + r() * 60;
    g.strokeStyle = '#0d1813'; g.lineCap = 'round'; g.lineWidth = 12;
    g.beginPath(); g.moveTo(x, y); g.bezierCurveTo(x + 80, y - 20, x + 160, y + 30, x + 260, y + 10); g.stroke();
    g.strokeStyle = '#4a6656'; g.lineWidth = 3; g.globalAlpha = .6;
    g.beginPath(); g.moveTo(x + 4, y - 5); g.bezierCurveTo(x + 80, y - 25, x + 160, y + 25, x + 255, y + 5); g.stroke(); g.globalAlpha = 1;
  }});

  drawFlies('mid2', u, cx, cy);
  // primeiro plano
  tile(FG, FG_W, frac(u * 2) * FG_W, cy * 1.5, cx * 1.5);
  drawFlies('near', u, cx * 1.5, cy * 1.5);
  // papel de guache
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = .55;
  ctx.drawImage(PAPER, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.drawImage(VIG, 0, 0);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
